# Deploys main to Cloudflare Pages (project missdynamics-com). The site has no
# build step: style.css is precompiled and committed. Only the files the site
# serves are staged, so scripts/, src/ and .github/ never get published.
# A deploy pipeline stays fail-fast, so every step is a Setup step.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Setup: check out main"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: "Setup: stage the published files"
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp -r index.html 404.html style.css robots.txt sitemap.xml _headers fonts "$RUNNER_TEMP/site/"

      - name: "Setup: deploy to Cloudflare Pages"
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ runner.temp }}/site --project-name=missdynamics-com --branch=main
